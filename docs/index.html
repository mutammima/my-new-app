<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuoNotes</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1d1d1f; --muted:#6b6b70; --rule:#e6e6e3; --accent:#3f6f52; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --fg:#ececed; --muted:#9a9aa0; --rule:#2a2a2e; --accent:#8fc0a2; }
  }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); padding:1.5rem; text-align:center;
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  h1 { font-size:2rem; margin:0 0 .5rem; letter-spacing:-.02em; }
  p { color:var(--muted); margin:.4rem 0 1.5rem; }
  a { color:var(--accent); }
</style>
</head>
<body>
  <div>
    <h1>DuoNotes</h1>
    <p>A private, lockable shared-notes app for two people.</p>
    <p><a href="./privacy.html">Privacy policy</a></p>
  </div>
</body>
</html>
