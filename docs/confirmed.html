<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DuoNotes — Email confirmed</title>
<style>
  :root { --bg:#fbfbfa; --fg:#1d1d1f; --muted:#6b6b70; --rule:#e6e6e3; --accent:#3f6f52; --card:#fff; --bad:#b4383c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#141416; --fg:#ececed; --muted:#9a9aa0; --rule:#2a2a2e; --accent:#8fc0a2; --card:#1c1c1f; --bad:#e08c8f; }
  }
  * { box-sizing: border-box; }
  body {
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--fg); padding:1.5rem;
    font:16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .card {
    background:var(--card); border:1px solid var(--rule); border-radius:16px;
    padding:2.25rem 1.75rem; max-width:26rem; width:100%; text-align:center;
  }
  .mark {
    width:56px; height:56px; border-radius:50%; margin:0 auto 1.25rem;
    display:flex; align-items:center; justify-content:center;
    background:color-mix(in srgb, var(--accent) 15%, transparent); color:var(--accent);
    font-size:1.75rem; line-height:1;
  }
  h1 { font-size:1.4rem; margin:0 0 .6rem; letter-spacing:-.01em; }
  p { margin:.5rem 0; color:var(--muted); }
  .step { color:var(--fg); font-weight:600; margin-top:1.25rem; }
  a { color:var(--accent); }
  .foot { margin-top:1.75rem; font-size:.85rem; }
  [hidden] { display:none !important; }
  .err .mark { background:color-mix(in srgb, var(--bad) 15%, transparent); color:var(--bad); }
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="mark" id="mark">&#10003;</div>
    <h1 id="title">Email confirmed</h1>
    <p id="body">Your DuoNotes account is ready.</p>
    <p class="step" id="step">Head back to the DuoNotes app and sign in.</p>
    <p class="foot"><a href="./privacy.html">Privacy policy</a></p>
  </div>
<script>
  // Supabase reports a failed or expired link in the URL, either as a query
  // string or in the fragment. Show that plainly instead of a green tick that
  // lies — an expired link is the most likely way someone lands here unhappy.
  (function () {
    var p = new URLSearchParams(location.search);
    var h = new URLSearchParams(location.hash.replace(/^#/, ''));
    var err = p.get('error_description') || p.get('error') || h.get('error_description') || h.get('error');
    if (!err) return;
    document.getElementById('card').className = 'card err';
    document.getElementById('mark').textContent = '!';
    document.getElementById('title').textContent = 'That link did not work';
    document.getElementById('body').textContent = decodeURIComponent(String(err).replace(/\+/g, ' '));
    document.getElementById('step').textContent =
      'Open DuoNotes, try to sign in, and choose "Resend confirmation email".';
  })();
</script>
</body>
</html>
